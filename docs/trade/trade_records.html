<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>成交记录 - STOCK LAB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            background: #f7f8fa;
            color: #17191d;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;
        }


        /* ========================================
           Page
        ======================================== */

        .trade-page {
            width: min(1400px, calc(100% - 48px));

            margin: 0 auto;

            padding: 38px 0 70px;
        }


        /* ========================================
           Back
        ======================================== */

        .back-link {
            display: inline-flex;

            align-items: center;
            gap: 7px;

            margin-bottom: 30px;

            color: #7b818a;

            font-size: 13px;

            text-decoration: none;

            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #17191d;
        }


        /* ========================================
           Header
        ======================================== */

        .page-header {
            display: flex;

            align-items: flex-end;
            justify-content: space-between;

            gap: 30px;

            margin-bottom: 28px;
        }

        .page-eyebrow {
            margin-bottom: 9px;

            color: #9298a1;

            font-size: 11px;
            font-weight: 650;

            letter-spacing: 0.14em;
        }

        .page-title {
            margin: 0;

            font-size: 32px;
            line-height: 1.2;

            font-weight: 700;

            letter-spacing: -0.035em;
        }

        .page-description {
            margin: 9px 0 0;

            color: #7b818a;

            font-size: 13px;
            line-height: 1.6;
        }


        /* ========================================
           Filter Card
        ======================================== */

        .filter-card {
            margin-bottom: 18px;

            padding: 20px;

            border: 1px solid #e6e8ec;
            border-radius: 14px;

            background: #ffffff;
        }


        .filter-row {
            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 14px;
        }

        .filter-row:last-child {
            margin-bottom: 0;
        }


        .filter-label {
            flex: 0 0 56px;

            color: #8a9099;

            font-size: 12px;
        }


        .filter-options {
            display: flex;

            align-items: center;
            flex-wrap: wrap;

            gap: 6px;
        }


        .filter-button {
            padding: 7px 13px;

            border: 1px solid transparent;
            border-radius: 7px;

            background: transparent;

            color: #727780;

            font-size: 12px;

            cursor: pointer;

            transition:
                color 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .filter-button:hover {
            background: #f4f5f7;

            color: #33373d;
        }

        .filter-button.active {
            border-color: #e0e2e6;

            background: #f0f1f3;

            color: #17191d;

            font-weight: 600;
        }


        /* ========================================
           Search
        ======================================== */

        .search-area {
            display: flex;

            align-items: center;

            gap: 8px;

            margin-left: auto;
        }


        .search-input {
            width: 230px;

            height: 34px;

            padding: 0 12px;

            border: 1px solid #e1e3e7;
            border-radius: 7px;

            outline: none;

            background: #fafbfc;

            color: #17191d;

            font-size: 12px;

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .search-input:focus {
            border-color: #bfc4cb;

            background: #ffffff;
        }


        .reset-button {
            height: 34px;

            padding: 0 12px;

            border: 1px solid #e1e3e7;
            border-radius: 7px;

            background: #ffffff;

            color: #707680;

            font-size: 12px;

            cursor: pointer;
        }

        .reset-button:hover {
            background: #f5f6f7;

            color: #17191d;
        }


        /* ========================================
           Date Range
        ======================================== */

        .date-range {
            display: flex;

            align-items: center;

            gap: 7px;
        }

        .date-input {
            height: 34px;

            padding: 0 10px;

            border: 1px solid #e1e3e7;
            border-radius: 7px;

            outline: none;

            background: #fafbfc;

            color: #4d5259;

            font-size: 12px;
        }

        .date-separator {
            color: #a0a5ad;

            font-size: 12px;
        }


        /* ========================================
           Summary
        ======================================== */

        .summary-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 1px;

            margin-bottom: 18px;

            overflow: hidden;

            border: 1px solid #e6e8ec;
            border-radius: 14px;

            background: #e6e8ec;
        }


        .summary-item {
            padding: 19px 22px;

            background: #ffffff;
        }


        .summary-label {
            display: block;

            margin-bottom: 8px;

            color: #9298a1;

            font-size: 11px;
        }


        .summary-value {
            display: block;

            font-size: 20px;
            font-weight: 650;

            letter-spacing: -0.02em;

            font-variant-numeric: tabular-nums;
        }


        .summary-sub {
            display: block;

            margin-top: 5px;

            color: #a0a5ad;

            font-size: 11px;
        }


        /* ========================================
           Table Card
        ======================================== */

        .table-card {
            overflow: hidden;

            border: 1px solid #e6e8ec;
            border-radius: 14px;

            background: #ffffff;
        }


        .table-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 18px 20px;

            border-bottom: 1px solid #eceef1;
        }


        .table-title {
            margin: 0;

            font-size: 15px;
            font-weight: 650;
        }


        .table-count {
            color: #9298a1;

            font-size: 12px;
        }


        /* ========================================
           Table
        ======================================== */

        .table-wrap {
            overflow-x: auto;
        }


        .trade-table {
            width: 100%;

            border-collapse: collapse;

            font-size: 13px;
        }


        .trade-table th {
            padding: 12px 18px;

            border-bottom: 1px solid #eceef1;

            background: #fafbfc;

            color: #9298a1;

            font-size: 11px;
            font-weight: 500;

            text-align: right;

            white-space: nowrap;
        }


        .trade-table th:first-child,
        .trade-table th:nth-child(2) {
            text-align: left;
        }


        .trade-table td {
            padding: 14px 18px;

            border-bottom: 1px solid #f0f1f3;

            color: #4c5159;

            text-align: right;

            white-space: nowrap;

            font-variant-numeric: tabular-nums;
        }


        .trade-table td:first-child,
        .trade-table td:nth-child(2) {
            text-align: left;
        }


        .trade-table tbody tr {
            transition: background 0.15s ease;
        }


        .trade-table tbody tr:hover {
            background: #fafbfc;
        }


        .trade-table tbody tr:last-child td {
            border-bottom: 0;
        }


        /* ========================================
           Time
        ======================================== */

        .trade-time {
            color: #707680 !important;

            font-size: 12px;
        }


        /* ========================================
           Stock
        ======================================== */

        .stock-cell {
            display: flex;

            align-items: center;

            gap: 9px;
        }


        .stock-name {
            color: #25292e;

            font-weight: 600;
        }


        .stock-symbol {
            color: #9a9fa7;

            font-size: 11px;
        }


        /* ========================================
           Buy / Sell
        ======================================== */

        .trade-side {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 42px;

            padding: 4px 9px;

            border-radius: 5px;

            font-size: 11px;
            font-weight: 600;
        }


        .trade-buy {
            background: #fff0f0;

            color: #d14d4d;
        }


        .trade-sell {
            background: #eef8f1;

            color: #318653;
        }


        /* ========================================
           Price
        ======================================== */

        .trade-price {
            color: #17191d !important;

            font-weight: 650;
        }


        /* ========================================
           Amount
        ======================================== */

        .trade-amount {
            color: #30343a !important;

            font-weight: 550;
        }


        /* ========================================
           Status
        ======================================== */

        .trade-status {
            display: inline-flex;

            align-items: center;

            gap: 6px;

            color: #318653;

            font-size: 12px;
        }


        .trade-status::before {
            content: "";

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: currentColor;
        }


        .trade-status.partial {
            color: #b27b28;
        }


        .trade-status.cancelled {
            color: #9298a1;
        }


        /* ========================================
           Order ID
        ======================================== */

        .order-id {
            color: #9298a1 !important;

            font-size: 11px;
        }


        /* ========================================
           Pagination
        ======================================== */

        .table-footer {
            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 15px 20px;

            border-top: 1px solid #eceef1;
        }


        .result-info {
            color: #9298a1;

            font-size: 11px;
        }


        .pagination {
            display: flex;

            align-items: center;

            gap: 5px;
        }


        .page-button {
            min-width: 30px;
            height: 30px;

            padding: 0 8px;

            border: 1px solid #e1e3e7;
            border-radius: 6px;

            background: #ffffff;

            color: #737981;

            font-size: 11px;

            cursor: pointer;
        }


        .page-button:hover {
            background: #f5f6f7;

            color: #17191d;
        }


        .page-button.active {
            border-color: #d9dce1;

            background: #f0f1f3;

            color: #17191d;

            font-weight: 600;
        }


        .page-button:disabled {
            opacity: 0.45;

            cursor: not-allowed;
        }


        /* ========================================
           Empty
        ======================================== */

        .empty-state {
            display: none;

            padding: 70px 20px;

            text-align: center;

            color: #9298a1;
        }


        .empty-title {
            margin-bottom: 7px;

            color: #656b73;

            font-size: 14px;
        }


        .empty-description {
            font-size: 12px;
        }


        /* ========================================
           Responsive
        ======================================== */

        @media (max-width: 1000px) {

            .filter-row {
                align-items: flex-start;

                flex-direction: column;

                gap: 9px;
            }

            .filter-label {
                flex-basis: auto;
            }

            .search-area {
                margin-left: 0;
            }

        }


        @media (max-width: 800px) {

            .trade-page {
                width: min(100% - 28px,
                        1400px);

                padding-top: 25px;
            }

            .page-header {
                align-items: flex-start;

                flex-direction: column;
            }

            .summary-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .search-input {
                width: 200px;
            }

        }


        @media (max-width: 560px) {

            .summary-grid {
                grid-template-columns: 1fr 1fr;
            }

            .date-range {
                flex-wrap: wrap;
            }

            .date-input {
                width: 130px;
            }

            .search-area {
                width: 100%;
            }

            .search-input {
                flex: 1;

                width: auto;
            }

            .table-footer {
                align-items: flex-start;

                flex-direction: column;

                gap: 12px;
            }

        }
    </style>

</head>


<body>

    <main class="trade-page">


        <!-- ========================================
         返回
    ========================================= -->

        <a class="back-link" href="javascript:history.back()">
            ← 返回
        </a>


        <!-- ========================================
         Header
    ========================================= -->

        <header class="page-header">

            <div>

                <div class="page-eyebrow">
                    STOCK LAB · MY TRADES
                </div>

                <h1 class="page-title">
                    成交记录
                </h1>

                <p class="page-description">
                    查看账户历史买卖成交，支持按股票、时间、方向和状态筛选。
                </p>

            </div>

        </header>


        <!-- ========================================
         Filters
    ========================================= -->

        <section class="filter-card">


            <!-- 股票 -->

            <div class="filter-row">

                <span class="filter-label">
                    股票
                </span>


                <div class="filter-options">

                    <button class="filter-button active" data-stock="all" type="button">
                        全部
                    </button>

                    <button class="filter-button" data-stock="601398" type="button">
                        工商银行
                    </button>

                    <button class="filter-button" data-stock="600519" type="button">
                        贵州茅台
                    </button>

                    <button class="filter-button" data-stock="000001" type="button">
                        平安银行
                    </button>

                    <button class="filter-button" data-stock="300750" type="button">
                        宁德时代
                    </button>

                </div>


                <div class="search-area">

                    <input id="searchInput" class="search-input" type="search" placeholder="搜索股票、代码、订单号...">

                    <button id="resetButton" class="reset-button" type="button">
                        重置
                    </button>

                </div>

            </div>


            <!-- 时间 -->

            <div class="filter-row">

                <span class="filter-label">
                    时间
                </span>


                <div class="filter-options">

                    <button class="filter-button active" data-date="all" type="button">
                        全部
                    </button>

                    <button class="filter-button" data-date="today" type="button">
                        今日
                    </button>

                    <button class="filter-button" data-date="7" type="button">
                        近 7 日
                    </button>

                    <button class="filter-button" data-date="30" type="button">
                        近 30 日
                    </button>

                </div>


                <div class="date-range">

                    <input id="startDate" class="date-input" type="date">

                    <span class="date-separator">
                        至
                    </span>

                    <input id="endDate" class="date-input" type="date">

                </div>

            </div>


            <!-- 方向 -->

            <div class="filter-row">

                <span class="filter-label">
                    方向
                </span>


                <div class="filter-options">

                    <button class="filter-button active" data-side="all" type="button">
                        全部
                    </button>

                    <button class="filter-button" data-side="BUY" type="button">
                        买入
                    </button>

                    <button class="filter-button" data-side="SELL" type="button">
                        卖出
                    </button>

                </div>

            </div>


            <!-- 状态 -->

            <div class="filter-row">

                <span class="filter-label">
                    状态
                </span>


                <div class="filter-options">

                    <button class="filter-button active" data-status="all" type="button">
                        全部
                    </button>

                    <button class="filter-button" data-status="FILLED" type="button">
                        已成交
                    </button>

                    <button class="filter-button" data-status="PARTIAL" type="button">
                        部分成交
                    </button>

                    <button class="filter-button" data-status="CANCELLED" type="button">
                        已撤单
                    </button>

                </div>

            </div>


        </section>


        <!-- ========================================
         Summary
    ========================================= -->

        <section class="summary-grid">


            <div class="summary-item">

                <span class="summary-label">
                    成交笔数
                </span>

                <strong id="totalCount" class="summary-value">
                    0
                </strong>

                <span class="summary-sub">
                    当前筛选结果
                </span>

            </div>


            <div class="summary-item">

                <span class="summary-label">
                    买入金额
                </span>

                <strong id="buyAmount" class="summary-value">
                    ¥0
                </strong>

                <span class="summary-sub">
                    买入成交
                </span>

            </div>


            <div class="summary-item">

                <span class="summary-label">
                    卖出金额
                </span>

                <strong id="sellAmount" class="summary-value">
                    ¥0
                </strong>

                <span class="summary-sub">
                    卖出成交
                </span>

            </div>


            <div class="summary-item">

                <span class="summary-label">
                    成交总额
                </span>

                <strong id="totalAmount" class="summary-value">
                    ¥0
                </strong>

                <span class="summary-sub">
                    买入 + 卖出
                </span>

            </div>


        </section>


        <!-- ========================================
         Table
    ========================================= -->

        <section class="table-card">


            <header class="table-header">

                <h2 class="table-title">
                    我的成交
                </h2>

                <span id="tableCount" class="table-count">
                    0 条记录
                </span>

            </header>


            <div class="table-wrap">

                <table class="trade-table">

                    <thead>

                        <tr>

                            <th>
                                成交时间
                            </th>

                            <th>
                                股票
                            </th>

                            <th>
                                方向
                            </th>

                            <th>
                                成交价格
                            </th>

                            <th>
                                成交数量
                            </th>

                            <th>
                                成交金额
                            </th>

                            <th>
                                手续费
                            </th>

                            <th>
                                状态
                            </th>

                            <th>
                                订单编号
                            </th>

                        </tr>

                    </thead>


                    <tbody id="tradeTableBody">

                    </tbody>

                </table>


                <div id="emptyState" class="empty-state">

                    <div class="empty-title">
                        没有找到成交记录
                    </div>

                    <div class="empty-description">
                        可以尝试调整筛选条件或搜索关键词。
                    </div>

                </div>

            </div>


            <!-- Pagination -->

            <footer class="table-footer">

                <span id="resultInfo" class="result-info">
                    -
                </span>


                <div class="pagination">

                    <button id="prevPage" class="page-button" type="button">
                        ‹
                    </button>

                    <div id="pageNumbers"></div>

                    <button id="nextPage" class="page-button" type="button">
                        ›
                    </button>

                </div>

            </footer>


        </section>


    </main>

                price: 1451.00,
                quantity: 50,
                amount: 72550,
                commission: 21.77,
                status: "CANCELLED"
            }

        ];


        /*
         * ========================================
         * State
         * ========================================
         */

        const state = {

            stock: "all",

            date: "all",

            side: "all",

            status: "all",

            search: "",

            page: 1,

            pageSize: 8

        };


        /*
         * ========================================
         * Elements
         * ========================================
         */

        const tableBody =
            document.getElementById("tradeTableBody");

        const emptyState =
            document.getElementById("emptyState");

        const totalCount =
            document.getElementById("totalCount");

        const buyAmount =
            document.getElementById("buyAmount");

        const sellAmount =
            document.getElementById("sellAmount");

        const totalAmount =
            document.getElementById("totalAmount");

        const tableCount =
            document.getElementById("tableCount");

        const resultInfo =
            document.getElementById("resultInfo");

        const pageNumbers =
            document.getElementById("pageNumbers");

        const prevPage =
            document.getElementById("prevPage");

        const nextPage =
            document.getElementById("nextPage");

        const searchInput =
            document.getElementById("searchInput");


        /*
         * ========================================
         * Format
         * ========================================
         */

        function formatNumber(value) {

            return Number(value).toLocaleString(
                "zh-CN"
            );

        }


        function formatMoney(value) {

            return "¥" + Number(value).toLocaleString(
                "zh-CN",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );

        }


        function getStatusText(status) {

            const statusMap = {

                FILLED: "已成交",

                PARTIAL: "部分成交",

                CANCELLED: "已撤单"

            };

            return statusMap[status] || status;

        }


        /*
         * ========================================
         * Date Filter
         * ========================================
         */

        function matchDate(record) {

            if (state.date === "all") {
                return true;
            }

            const recordDate =
                new Date(record.time);

            const today =
                new Date("2026-09-21T23:59:59");

            if (state.date === "today") {

                return (
                    recordDate.toDateString() ===
                    today.toDateString()
                );

            }

            const days =
                Number(state.date);

            const start =
                new Date(today);

            start.setDate(
                start.getDate() - days + 1
            );

            start.setHours(0, 0, 0, 0);

            return recordDate >= start;

        }


        /*
         * ========================================
         * Filter
         * ========================================
         */

        function getFilteredRecords() {

            return tradeRecords.filter(record => {

                if (
                    state.stock !== "all" &&
                    record.symbol !== state.stock
                ) {
                    return false;
                }


                if (
                    state.side !== "all" &&
                    record.side !== state.side
                ) {
                    return false;
                }


                if (
                    state.status !== "all" &&
                    record.status !== state.status
                ) {
                    return false;
                }


                if (!matchDate(record)) {
                    return false;
                }


                if (state.search) {

                    const keyword =
                        state.search.toLowerCase();

                    const content = [

                        record.name,

                        record.symbol,

                        record.id

                    ]
                        .join(" ")
                        .toLowerCase();


                    if (
                        !content.includes(keyword)
                    ) {
                        return false;
                    }

                }


                return true;

            });

        }


        /*
         * ========================================
         * Summary
         * ========================================
         */

        function updateSummary(records) {

            const buyRecords =
                records.filter(
                    record => record.side === "BUY"
                );

            const sellRecords =
                records.filter(
                    record => record.side === "SELL"
                );


            const buyTotal =
                buyRecords.reduce(
                    (sum, record) =>
                        sum + record.amount,
                    0
                );


            const sellTotal =
                sellRecords.reduce(
                    (sum, record) =>
                        sum + record.amount,
                    0
                );


            totalCount.textContent =
                formatNumber(records.length);

            buyAmount.textContent =
                formatMoney(buyTotal);

            sellAmount.textContent =
                formatMoney(sellTotal);

            totalAmount.textContent =
                formatMoney(
                    buyTotal + sellTotal
                );

            tableCount.textContent =
                `${records.length} 条记录`;

        }


        /*
         * ========================================
         * Render Table
         * ========================================
         */

        function renderTable(records) {

            tableBody.innerHTML = "";


            if (!records.length) {

                emptyState.style.display =
                    "block";

                return;

            }


            emptyState.style.display =
                "none";


            const start =
                (state.page - 1) *
                state.pageSize;

            const end =
                start + state.pageSize;


            const pageRecords =
                records.slice(start, end);


            pageRecords.forEach(record => {

                const tr =
                    document.createElement("tr");


                const sideClass =
                    record.side === "BUY"
                        ? "trade-buy"
                        : "trade-sell";


                const sideText =
                    record.side === "BUY"
                        ? "买入"
                        : "卖出";


                let statusClass =
                    "";

                if (record.status === "PARTIAL") {
                    statusClass = "partial";
                }

                if (record.status === "CANCELLED") {
                    statusClass = "cancelled";
                }


                tr.innerHTML = `

                <td class="trade-time">
                    ${record.time}
                </td>

                <td>

                    <div class="stock-cell">

                        <span class="stock-name">
                            ${record.name}
                        </span>

                        <span class="stock-symbol">
                            ${record.symbol}
                        </span>

                    </div>

                </td>

                <td>

                    <span
                        class="trade-side ${sideClass}"
                    >
                        ${sideText}
                    </span>

                </td>

                <td class="trade-price">
                    ${record.price.toLocaleString(
                    "zh-CN",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                )}
                </td>

                <td>
                    ${formatNumber(record.quantity)}
                </td>

                <td class="trade-amount">
                    ${formatMoney(record.amount)}
                </td>

                <td>
                    ${formatMoney(record.commission)}
                </td>

                <td>

                    <span
                        class="trade-status ${statusClass}"
                    >
                        ${getStatusText(record.status)}
                    </span>

                </td>

                <td class="order-id">
                    ${record.id}
                </td>

            `;


                tableBody.appendChild(tr);

            });

        }


        /*
         * ========================================
         * Pagination
         * ========================================
         */

        function renderPagination(records) {

            const totalPages =
                Math.max(
                    1,
                    Math.ceil(
                        records.length /
                        state.pageSize
                    )
                );


            if (state.page > totalPages) {
                state.page = totalPages;
            }


            pageNumbers.innerHTML = "";


            for (
                let page = 1;
                page <= totalPages;
                page++
            ) {

                if (
                    totalPages > 7 &&
                    page > 3 &&
                    page < totalPages - 2
                ) {

                    if (
                        page === 4
                    ) {

                        const dots =
                            document.createElement(
                                "span"
                            );

                        dots.textContent = "...";

                        dots.style.padding =
                            "0 5px";

                        dots.style.color =
                            "#a0a5ad";

                        pageNumbers.appendChild(
                            dots
                        );

                    }

                    continue;

                }


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "page-button";


                if (
                    page === state.page
                ) {

                    button.classList.add(
                        "active"
                    );

                }


                button.type =
                    "button";


                button.textContent =
                    page;


                button.addEventListener(
                    "click",
                    () => {

                        state.page = page;

                        render();

                    }
                );


                pageNumbers.appendChild(
                    button
                );

            }


            prevPage.disabled =
                state.page <= 1;


            nextPage.disabled =
                state.page >= totalPages;


            const start =
                records.length === 0
                    ? 0
                    : (
                        (state.page - 1) *
                        state.pageSize
                    ) + 1;


            const end =
                Math.min(
                    state.page *
                    state.pageSize,
                    records.length
                );


            resultInfo.textContent =
                records.length
                    ? `显示 ${start}-${end} 条，共 ${records.length} 条`
                    : "暂无记录";

        }


        /*
         * ========================================
         * Render
         * ========================================
         */

        function render() {

            const records =
                getFilteredRecords();


            const totalPages =
                Math.max(
                    1,
                    Math.ceil(
                        records.length /
                        state.pageSize
                    )
                );


            if (
                state.page > totalPages
            ) {

                state.page =
                    totalPages;

            }


            updateSummary(records);

            renderTable(records);

            renderPagination(records);

        }


        /*
         * ========================================
         * Stock Filter
         * ========================================
         */

        document
            .querySelectorAll(
                "[data-stock]"
            )
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                "[data-stock]"
                            )
                            .forEach(item => {

                                item.classList.remove(
                                    "active"
                                );

                            });


                        button.classList.add(
                            "active"
                        );


                        state.stock =
                            button.dataset.stock;

                        state.page = 1;

                        render();

                    }
                );

            });


        /*
         * ========================================
         * Date Filter
         * ========================================
         */

        document
            .querySelectorAll(
                "[data-date]"
            )
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                "[data-date]"
                            )
                            .forEach(item => {

                                item.classList.remove(
                                    "active"
                                );

                            });


                        button.classList.add(
                            "active"
                        );


                        state.date =
                            button.dataset.date;

                        state.page = 1;

                        render();

                    }
                );

            });


        /*
         * ========================================
         * Side Filter
         * ========================================
         */

        document
            .querySelectorAll(
                "[data-side]"
            )
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                "[data-side]"
                            )
                            .forEach(item => {

                                item.classList.remove(
                                    "active"
                                );

                            });


                        button.classList.add(
                            "active"
                        );


                        state.side =
                            button.dataset.side;

                        state.page = 1;

                        render();

                    }
                );

            });


        /*
         * ========================================
         * Status Filter
         * ========================================
         */

        document
            .querySelectorAll(
                "[data-status]"
            )
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                "[data-status]"
                            )
                            .forEach(item => {

                                item.classList.remove(
                                    "active"
                                );

                            });


                        button.classList.add(
                            "active"
                        );


                        state.status =
                            button.dataset.status;

                        state.page = 1;

                        render();

                    }
                );

            });


        /*
         * ========================================
         * Search
         * ========================================
         */

        searchInput.addEventListener(
            "input",
            event => {

                state.search =
                    event.target.value.trim();

                state.page = 1;

                render();

            }
        );


        /*
         * ========================================
         * Reset
         * ========================================
         */

        document
            .getElementById("resetButton")
            .addEventListener(
                "click",
                () => {

                    state.stock = "all";
                    state.date = "all";
                    state.side = "all";
                    state.status = "all";
                    state.search = "";
                    state.page = 1;


                    searchInput.value = "";


                    document
                        .querySelectorAll(
                            ".filter-button"
                        )
                        .forEach(button => {

                            button.classList.remove(
                                "active"
                            );

                        });


                    document
                        .querySelector(
                            '[data-stock="all"]'
                        )
                        .classList.add(
                            "active"
                        );


                    document
                        .querySelector(
                            '[data-date="all"]'
                        )
                        .classList.add(
                            "active"
                        );


                    document
                        .querySelector(
                            '[data-side="all"]'
                        )
                        .classList.add(
                            "active"
                        );


                    document
                        .querySelector(
                            '[data-status="all"]'
                        )
                        .classList.add(
                            "active"
                        );


                    render();

                }
            );


        /*
         * ========================================
         * Pagination Buttons
         * ========================================
         */

        prevPage.addEventListener(
            "click",
            () => {

                if (state.page > 1) {

                    state.page--;

                    render();

                }

            }
        );


        nextPage.addEventListener(
            "click",
            () => {

                const records =
                    getFilteredRecords();

                const totalPages =
                    Math.ceil(
                        records.length /
                        state.pageSize
                    );


                if (
                    state.page <
                    totalPages
                ) {

                    state.page++;

                    render();

                }

            }
        );


        /*
         * ========================================
         * Initial Render
         * ========================================
         */

        render();

    </script>

</body>

</html>
